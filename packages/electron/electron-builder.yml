appId: com.ptv.discovery-coach
productName: PTV Discovery Coach
copyright: Copyright © 2024 PTV Group

directories:
  output: dist
  buildResources: build

files:
  - dist/**/*
  - node_modules/**/*
  - package.json

extraResources:
  - from: ../../packages/frontend/dist
    to: frontend/dist
    filter:
      - "**/*"
  - from: resources/wasm
    to: wasm
    filter:
      - "**/*"

extraMetadata:
  backendUrl: https://app.ptv-discovery-coach.com
  environment: production

win:
  icon: ../../ptv_logo.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: PTV Discovery Coach
  installerIcon: ../../ptv_logo.ico
  uninstallerIcon: ../../ptv_logo.ico
  deleteAppDataOnUninstall: false

publish:
  provider: generic
  url: https://updates.ptv-discovery-coach.com/releases/

electronVersion: "31.0.0"
