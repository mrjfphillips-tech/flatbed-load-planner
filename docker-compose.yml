version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: optiflow-postgres
    environment:
      POSTGRES_USER: optiflow
      POSTGRES_PASSWORD: optiflow_dev
      POSTGRES_DB: optiflow_load_planner
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U optiflow -d optiflow_load_planner']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
