version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ptv-coach-postgres
    environment:
      POSTGRES_USER: ptv_coach
      POSTGRES_PASSWORD: ptv_coach_dev
      POSTGRES_DB: ptv_discovery_coach
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ptv_coach -d ptv_discovery_coach']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ptv-coach-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: ptv-coach-neo4j
    environment:
      NEO4J_AUTH: neo4j/ptv_coach_dev
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - '7474:7474'
      - '7687:7687'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1']
      interval: 10s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
